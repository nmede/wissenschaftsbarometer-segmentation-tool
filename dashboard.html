<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wissenschaftsbarometer — Segment Monitor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');
@font-face{font-family:"Akkurat Pro";src:url("fonts/AkkuratPro-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
:root{
  --red:#e30613; --red-90:#e63323; --red-70:#ed694b; --red-40:#f6af95; --red-20:#fcd9ca; --red-10:#fdece3;
  --ink:#1d1d1d; --ink-60:#5f5f5f; --line:#e2e2e2; --white:#fff;
  --s1:#e30613; --s2:#ed694b; --s3:#f6af95; --s4:#fcd9ca;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Akkurat Pro","Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--white);font-size:15px}
.wrap{max-width:1120px;margin:0 auto;padding:22px 22px 80px}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:14px;border-bottom:3px solid var(--ink);margin-bottom:20px}
.brandbar img{height:36px;display:block}
.langbar{display:flex;border:2px solid var(--ink)}
.langbar button{border:0;background:var(--white);font:inherit;font-size:12px;font-weight:700;color:var(--ink);padding:5px 10px;cursor:pointer}
.langbar button + button{border-left:2px solid var(--ink)}
.langbar button[aria-pressed="true"]{background:var(--ink);color:var(--white)}

.gate{max-width:420px;margin:8vh auto;border:2px solid var(--ink);padding:32px 30px}
.gate h1{font-family:"Bebas Neue",sans-serif;font-size:38px;letter-spacing:.03em;margin:0 0 4px}
.gate h1 b{color:var(--red)}
.gate p{color:var(--ink-60);font-size:14px;margin:0 0 20px;line-height:1.5}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.field input{width:100%;font:inherit;font-size:15px;padding:11px 13px;border:2px solid var(--ink)}
.field input:focus{outline:none;border-color:var(--red)}
.btn{font:inherit;font-weight:700;font-size:15px;border:2px solid var(--red);padding:12px 20px;cursor:pointer;background:var(--red);color:var(--white);width:100%;transition:.15s}
.btn:hover{background:var(--red-90);border-color:var(--red-90)}
.gate-err{color:var(--red);font-size:13px;margin-top:10px;min-height:16px;font-weight:700}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px}
.title{font-family:"Bebas Neue",sans-serif;font-size:40px;line-height:1;letter-spacing:.02em}
.title b{color:var(--red)}
.sub{color:var(--ink-60);font-size:13px;margin-top:4px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--red);border:2px solid var(--red);padding:5px 12px;letter-spacing:.04em;text-transform:uppercase}
.live .pulse{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.toolbtn{background:var(--white);border:2px solid var(--ink);color:var(--ink);font:inherit;font-size:12px;font-weight:700;padding:6px 13px;cursor:pointer;letter-spacing:.04em;text-transform:uppercase}
.toolbtn:hover{background:var(--line)}
.toolbtn:disabled{opacity:.4;cursor:not-allowed}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0;border:2px solid var(--ink);margin-bottom:20px}
.kpi{padding:16px 18px;border-right:2px solid var(--ink)}
.kpi:last-child{border-right:0}
.kpi .n{font-family:"Bebas Neue",sans-serif;font-size:36px;line-height:1}
.kpi .l{font-size:11.5px;color:var(--ink-60);margin-top:4px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
@media(max-width:760px){.kpi{border-right:0;border-bottom:2px solid var(--ink)}.kpi:last-child{border-bottom:0}}

.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:18px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.panel{border:2px solid var(--ink);padding:18px 20px;margin-bottom:18px}
.grid .panel{margin-bottom:0}
.panel h2{font-family:"Bebas Neue",sans-serif;font-size:24px;letter-spacing:.03em;margin:0 0 14px}
.panel h2 b{color:var(--red)}
.panel h3{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-60);margin:20px 0 10px}

.segrow{display:flex;align-items:center;gap:14px;margin-bottom:13px}
.segrow:last-child{margin-bottom:0}
.segname{width:170px;flex:0 0 auto;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:9px;line-height:1.2}
.swatch{width:12px;height:12px;flex:0 0 auto;border:1px solid var(--ink)}
.track{flex:1;height:26px;background:var(--red-10);position:relative}
.trackfill{height:100%;transition:width .5s ease;min-width:2px;border-right:1px solid var(--ink)}
.segval{width:150px;flex:0 0 auto;text-align:right;font-size:12.5px;color:var(--ink-60);font-variant-numeric:tabular-nums}
.segval b{color:var(--ink);font-size:15px}

.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:0 0 auto}
.legendlist{font-size:13px}
.legendlist div{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.legendlist b{font-variant-numeric:tabular-nums;margin-left:auto;padding-left:12px}

.bars{display:flex;gap:16px;flex-wrap:wrap}
.barcol{flex:1;min-width:130px;max-width:230px}
.barcol .cap{font-size:12.5px;margin-bottom:7px;font-weight:700}
.barcol .cap span{color:var(--ink-60);font-weight:400}
.stack{display:flex;height:22px;background:var(--red-10);border:1px solid var(--ink)}
.stack span{display:block}

/* per-question distributions */
.qrow{display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,1.2fr) 120px;gap:16px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.qrow .qt{font-size:13px;line-height:1.35}
.qrow .qstack{display:flex;height:20px;background:#f4f4f4;border:1px solid var(--ink)}
.qrow .qstack span{display:block}
.qrow .qmeta{font-size:12px;color:var(--ink-60);text-align:right;font-variant-numeric:tabular-nums}
.qlegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--ink-60);margin:4px 0 8px}
.qlegend i{display:inline-block;width:10px;height:10px;border:1px solid var(--ink);margin-right:5px;vertical-align:-1px}
@media(max-width:680px){.qrow{grid-template-columns:1fr;gap:6px}.qrow .qmeta{text-align:left}}

.danger{border-color:var(--red)}
.danger h2{color:var(--red)}
.confirmbox{background:var(--red-10);border:2px solid var(--red);padding:14px 16px;margin-top:12px}
.confirmbox p{margin:0 0 12px;font-weight:700}
.btn-danger{background:var(--red);color:#fff;border:2px solid var(--red);font:inherit;font-weight:700;padding:10px 18px;cursor:pointer;margin-right:10px}
.btn-cancel{background:#fff;color:var(--ink);border:2px solid var(--ink);font:inherit;font-weight:700;padding:10px 18px;cursor:pointer}
.empty{color:var(--ink-60);font-size:14px;padding:10px 0;line-height:1.5}
.foot{margin-top:26px;font-size:12px;color:var(--ink-60);line-height:1.55;border-top:1px solid var(--line);padding-top:14px}
.sechead{font-family:"Bebas Neue",sans-serif;font-size:32px;letter-spacing:.03em;margin:6px 0 14px;border-bottom:3px solid var(--ink);padding-bottom:6px}
.sechead b{color:var(--red)}
.bars3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-bottom:18px}
.bars3 .panel{margin-bottom:0}
.distrow{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.distrow .dl{width:190px;flex:0 0 auto;font-size:12.5px;font-weight:700;line-height:1.25}
.distrow .dtrack{flex:1;height:20px;display:flex}
.distrow .dtrack span{display:block;height:100%}
.distrow .dv{width:86px;flex:0 0 auto;text-align:right;font-size:12px;color:var(--ink-60);font-variant-numeric:tabular-nums}
.distrow .dv b{color:var(--ink)}
.pbar{position:relative;flex:1;height:20px}
.pbar span{position:absolute;left:0;top:0;bottom:0}
.stack .pl,.qstack .pl{font-size:10px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.stack .pl.dk1,.qstack .pl.dk1{color:var(--ink)}
.meanrow{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.meanrow .ml{width:230px;flex:0 0 auto;font-size:12.5px;font-weight:700;line-height:1.3}
.meanrow .ml span{color:var(--ink-60);font-weight:400}
.meanrow .mbars{flex:1;min-width:260px;display:flex;flex-direction:column;gap:4px}
.mbar{display:flex;align-items:center;gap:8px}
.mbar .sn{width:150px;flex:0 0 auto;font-size:11px;display:flex;align-items:center;gap:6px}
.mbar .mtrack{flex:1;height:14px;position:relative}
.mbar .mtrack i{display:block;height:100%}
.mbar .mv{width:40px;text-align:right;font-size:11.5px;font-variant-numeric:tabular-nums;font-weight:700}
.dq-page{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-60);margin:12px 0 6px}
.dq-item{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);padding:6px 11px;margin:0 6px 6px 0;font-size:12.5px;cursor:pointer;user-select:none}
.dq-item input{accent-color:var(--red)}
.dq-item.locked{opacity:.55;cursor:not-allowed;border-style:dashed}
.txt-row{display:grid;grid-template-columns:34px 1fr;gap:8px;margin-bottom:6px;align-items:start}
.txt-row .lg{font-size:11px;font-weight:700;color:var(--ink-60);padding-top:9px}
.txt-row textarea{font:inherit;font-size:13px;padding:8px 9px;border:1.5px solid var(--line);width:100%;min-height:40px;resize:vertical}
.txt-row textarea:focus{outline:none;border-color:var(--red)}
.txt-kind{font-size:12.5px;font-weight:700;margin:12px 0 6px}
.pub-item{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);padding:7px 12px;margin:0 6px 6px 0;font-size:13px;cursor:pointer;user-select:none}
.pub-item input{accent-color:var(--red)}
.tabs{display:flex;gap:0;border:2px solid var(--ink);margin-bottom:20px;flex-wrap:wrap}
.tabs button{border:0;background:var(--white);font:inherit;font-size:13px;font-weight:700;color:var(--ink);padding:11px 20px;cursor:pointer;letter-spacing:.03em;text-transform:uppercase}
.tabs button + button{border-left:2px solid var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--red);color:var(--white)}
.set-row{display:grid;grid-template-columns:210px 1fr;gap:16px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row .sl{font-weight:700;font-size:13.5px;padding-top:6px}
.iopt{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);padding:9px 14px;margin:0 8px 8px 0;cursor:pointer;font-size:13.5px;background:var(--white)}
.iopt[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.iopt[disabled]{opacity:.45;cursor:not-allowed}
.iopt small{font-weight:400}
input[type="color"]{width:56px;height:36px;border:2px solid var(--ink);padding:2px;background:#fff;cursor:pointer}
.cfg-note{font-size:12px;color:var(--ink-60);margin-top:6px;line-height:1.45}
.cq{border:1px solid var(--line);padding:12px 14px;margin-bottom:12px}
.cq-head{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.cq-head select{width:auto;font:inherit;font-size:13px;padding:7px 8px;border:2px solid var(--ink)}
.cq-langrow{display:grid;grid-template-columns:34px 1fr 150px 150px;gap:8px;margin-bottom:6px;align-items:center}
.cq-langrow .lg{font-size:11px;font-weight:700;color:var(--ink-60)}
.cq-langrow input{font:inherit;font-size:13px;padding:8px 9px;border:1.5px solid var(--line);width:100%}
.cq-langrow input:focus{outline:none;border-color:var(--red)}
.minibtn{background:#fff;border:1.5px solid var(--ink);font:inherit;font-size:11.5px;font-weight:700;padding:5px 10px;cursor:pointer;margin-left:6px}
.minibtn:hover{background:var(--line)}
.savebar{margin-top:14px;display:flex;gap:12px;align-items:center}
.okmsg{color:#1f7a3d;font-weight:700;font-size:13px}
.sharelink{font-family:monospace;font-size:12px;background:#f6f6f6;border:1px solid var(--line);padding:8px 10px;word-break:break-all;margin:8px 0;display:block}
@media(max-width:680px){.set-row{grid-template-columns:1fr}.cq-langrow{grid-template-columns:30px 1fr}.cq-langrow input:nth-child(n+3){grid-column:2}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar">
    <img src="img/logo.png" alt="Wissenschaftsbarometer">
    <div class="langbar" id="langbar">
      <button data-lang="de" aria-pressed="true">DE</button>
      <button data-lang="fr" aria-pressed="false">FR</button>
      <button data-lang="it" aria-pressed="false">IT</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <div id="gate" class="gate">
    <h1>Segment<b>.</b>Monitor</h1>
    <p data-t="gate_intro"></p>
    <div class="field"><label data-t="gate_survey"></label><input id="gSurvey" placeholder="museum-basel-2026" autocomplete="off"></div>
    <div class="field"><label data-t="gate_code"></label><input id="gCode" type="password" placeholder="••••••••" autocomplete="off"></div>
    <button class="btn" id="gEnter" data-t="gate_open"></button>
    <div class="gate-err" id="gateErr"></div>
  </div>

  <div id="app" hidden>
    <div class="head">
      <div>
        <div class="title"><span data-t="title"></span><b>.</b></div>
        <div class="sub" id="surveyTag"></div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="toolbtn" id="csvBtn" data-t="download"></button>
        <button class="toolbtn" id="refreshBtn" data-t="refresh"></button>
        <span class="live"><span class="pulse"></span><span id="liveText">Live</span></span>
      </div>
    </div>

    <div class="tabs" id="tabs">
      <button data-tab="results" aria-pressed="true" data-t="tab_results"></button>
      <button data-tab="settings" aria-pressed="false" data-t="tab_settings"></button>
      <button data-tab="public" aria-pressed="false" data-t="tab_public"></button>
      <button data-tab="consent" aria-pressed="false" data-t="tab_consent"></button>
    </div>

    <div id="tab-results">
    <h2 class="sechead"><span data-t="sec_overview"></span><b>.</b></h2>
    <div class="strip" id="kpis"></div>
    <div class="bars3">
      <div class="panel"><h2><span data-t="p_agedist"></span><b>.</b></h2><div id="ovAge"></div></div>
      <div class="panel"><h2><span data-t="p_genderdist"></span><b>.</b></h2><div id="ovGender"></div></div>
      <div class="panel"><h2><span data-t="p_edudist"></span><b>.</b></h2><div id="ovEdu"></div></div>
    </div>

    <h2 class="sechead"><span data-t="sec_segments"></span><b>.</b></h2>
    <div class="panel"><h2><span data-t="p_segments"></span><b>.</b></h2><div id="segBars"></div></div>
    <div class="bars3">
      <div class="panel"><h2><span data-t="p_seg_age"></span><b>.</b></h2><div id="sgAge"></div></div>
      <div class="panel"><h2><span data-t="p_seg_gender"></span><b>.</b></h2><div id="sgGender"></div></div>
      <div class="panel"><h2><span data-t="p_seg_edu"></span><b>.</b></h2><div id="sgEdu"></div></div>
    </div>
    <div class="panel"><h2><span data-t="p_seg_means"></span><b>.</b></h2><div id="sgMeans"></div></div>
    <div class="panel"><h2><span data-t="p_seg_region"></span><b>.</b></h2><div id="sgRegion"></div></div>

    <h2 class="sechead"><span data-t="sec_items"></span><b>.</b></h2>
    <div class="panel">
      <div class="qlegend" id="qLegend"></div>
      <div id="itemPanels"></div>
    </div>

    </div><!-- /tab-results -->

    <div id="tab-settings" hidden>
      <div class="panel"><h2><span data-t="p_instrument"></span><b>.</b></h2>
        <div id="instRow"></div>
        <div class="cfg-note" data-t="inst_note"></div>
      </div>
      <div class="panel"><h2><span data-t="p_customq"></span><b>.</b></h2>
        <div class="cfg-note" data-t="cq_note" style="margin-bottom:12px"></div>
        <div id="cqList"></div>
        <button class="toolbtn" id="cqAdd" data-t="cq_add"></button>
      </div>
      <div class="panel"><h2><span data-t="p_defaultq"></span><b>.</b></h2>
        <div class="cfg-note" data-t="dq_note" style="margin-bottom:10px"></div>
        <div id="dqList"></div>
      </div>
      <div class="panel"><h2><span data-t="p_texts"></span><b>.</b></h2>
        <div class="cfg-note" data-t="texts_note" style="margin-bottom:10px"></div>
        <div id="textsEditor"></div>
      </div>
      <div class="panel"><h2><span data-t="p_branding"></span><b>.</b></h2>
        <div class="set-row"><div class="sl" data-t="s_color"></div>
          <div><input type="color" id="cfgColor" value="#e30613">
               <button class="minibtn" id="colorReset" data-t="s_reset"></button>
               <div class="cfg-note" data-t="color_note"></div></div></div>
        <div class="set-row"><div class="sl" data-t="s_logo"></div>
          <div><input type="file" id="cfgLogo" accept="image/png,image/jpeg,image/svg+xml">
               <button class="minibtn" id="logoRemove" data-t="s_remove"></button>
               <div id="logoPrev" style="margin-top:8px"></div>
               <div class="cfg-note" data-t="logo_note"></div></div></div>
      </div>
      <div class="panel"><h2><span data-t="p_word"></span><b>.</b></h2>
        <div class="cfg-note" data-t="word_note" style="margin-bottom:10px"></div>
        <select id="wordLang" style="width:auto;margin-right:10px">
          <option value="de">Deutsch</option><option value="fr">Français</option>
          <option value="it">Italiano</option><option value="en">English</option>
        </select>
        <button class="toolbtn" id="wordExport" data-t="word_btn"></button>
      </div>
      <div class="savebar">
        <button class="btn" id="cfgSave" style="width:auto;padding:12px 26px" data-t="s_save"></button>
        <span class="okmsg" id="cfgMsg"></span>
      </div>

    <div class="panel danger"><h2><span data-t="p_danger"></span><b>.</b></h2>
      <p class="empty" data-t="danger_note"></p>
      <button class="toolbtn" id="delBtn" data-t="delete_all" style="border-color:var(--red);color:var(--red)"></button>
      <div id="confirmBox" hidden class="confirmbox">
        <p data-t="confirm_q"></p>
        <button class="btn-danger" id="delYes" data-t="confirm_yes"></button>
        <button class="btn-cancel" id="delNo" data-t="confirm_no"></button>
      </div>
      <div class="empty" id="delMsg"></div>
    </div>

    </div><!-- /tab-settings -->

    <div id="tab-public" hidden>
      <div class="panel"><h2><span data-t="p_share"></span><b>.</b></h2>
        <div class="cfg-note" data-t="share_note"></div>
        <div id="shareBox" style="margin-top:10px"></div>
      </div>
      <div class="panel"><h2><span data-t="p_pubpanels"></span><b>.</b></h2>
        <div class="cfg-note" data-t="pubpanels_note" style="margin-bottom:10px"></div>
        <div id="pubPanels"></div>
        <div class="savebar">
          <button class="btn" id="pubSave" style="width:auto;padding:12px 26px" data-t="s_save"></button>
          <span class="okmsg" id="pubMsg"></span>
        </div>
      </div>
    </div><!-- /tab-public -->

    <div id="tab-consent" hidden>
      <div class="panel"><h2><span data-t="p_consent"></span><b>.</b></h2>
        <p style="max-width:720px;line-height:1.55;font-size:14.5px" data-t="consent_text"></p>
        <p style="font-weight:700" id="consentState"></p>
        <div class="savebar">
          <button class="btn" id="consentGrant" style="width:auto;padding:12px 24px" data-t="c_grant"></button>
          <button class="toolbtn" id="consentRevoke" data-t="c_revoke"></button>
          <span class="okmsg" id="consentMsg"></span>
        </div>
      </div>
    </div><!-- /tab-consent -->

    <div class="foot" id="footNote"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/content.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  "use strict";

  var SEGC = {1:"#e30613", 2:"#ed694b", 3:"#f6af95", 4:"#fcd9ca"};
  var KEYCOLOR = "#e30613";
  var REGION_OF = {AG:"de_reg",AI:"de_reg",AR:"de_reg",BE:"de_reg",BL:"de_reg",BS:"de_reg",GL:"de_reg",GR:"de_reg",

  /* --- default-question toggles (segmentation items are locked) --- */
  function renderDefaultQ(){
    var el = document.getElementById("dqList");
    var off = {}; (cfgState.disabled_questions||[]).forEach(function(id){ off[id]=true; });
    var html = "";
    PAGES.forEach(function(pg){
      var qs = pg.items.map(function(id){ return QUESTIONS.filter(function(q){return q.id===id;})[0]; }).filter(Boolean);
      if(!qs.length) return;
      html += '<div class="dq-page">'+esc(pg.title[lang])+'</div>';
      qs.forEach(function(q){
        var locked = !!q.seg;
        var checked = locked || !off[q.id];
        var label = q.text[lang] || q.id;
        if(label.length > 70) label = label.slice(0,67)+"…";
        html += '<label class="dq-item'+(locked?" locked":"")+'" '+(locked?'title="'+esc(T().dq_locked)+'"':'')+'>'+
          '<input type="checkbox" data-dq="'+q.id+'"'+(checked?" checked":"")+(locked?" disabled":"")+'> '+esc(label)+'</label>';
      });
    });
    html += '<div class="dq-page">'+esc(T().tab_consent)+' / '+esc(T().dq_contact)+'</div>'+
      '<label class="dq-item"><input type="checkbox" data-dq="contact"'+(off.contact?"":" checked")+'> '+esc(T().dq_contact)+'</label>';
    el.innerHTML = html;
    Array.prototype.forEach.call(el.querySelectorAll("input[data-dq]"), function(cb){
      cb.onchange = function(){
        var id = cb.getAttribute("data-dq");
        var arr = cfgState.disabled_questions = cfgState.disabled_questions || [];
        var ix = arr.indexOf(id);
        if(cb.checked && ix !== -1) arr.splice(ix,1);
        if(!cb.checked && ix === -1) arr.push(id);
      };
    });
  }

  /* --- Word export of the questionnaire (Word-HTML .doc, dependency-free) --- */
  function wordExport(){
    var L = document.getElementById("wordLang").value || "de";
    var off = {}; (cfgState.disabled_questions||[]).forEach(function(id){ off[id]=true; });
    var byPos = {};
    cfgState.custom_questions.forEach(function(cq,i){
      cq = { id:"CQ"+(i+1), type:cq.type||"scale5c", pos:cq.pos||"about", text:cq.text||{},
             anchors:cq.anchors||{}, options:cq.options||{}, intro:cq.intro||{} };
      (byPos[cq.pos] = byPos[cq.pos] || []).push(cq);
    });
    function escH(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function scaleLine(n, ends, dk){
      var cells = "1 = "+(ends[0]||"")+" … "+n+" = "+(ends[1]||"");
      return '<p class="scale">'+escH(cells)+' &nbsp;|&nbsp; '+escH(dk)+'</p>';
    }
    var texts = cfgState.texts || {};
    function tx(kind, fallback){ return (texts[kind]&&texts[kind][L]) || fallback; }
    var html = '<h1>'+escH(tx("intro_title", UI[L].start_sub))+'</h1>'+
               '<p>'+escH(tx("intro_text", UI[L].start_intro))+'</p>';
    function renderCustom(cq){
      if(!(cq.text[L])) return "";
      var s = "";
      if(cq.intro[L]) s += '<p class="qintro">'+escH(cq.intro[L])+'</p>';
      s += '<p class="q">'+escH(cq.text[L])+'</p>';
      if(cq.type==="scale5c" || cq.type==="scale7c"){
        var a = cq.anchors[L] || cq.anchors.de || ["",""];
        s += scaleLine(cq.type==="scale7c"?7:5, a, UI[L].dont_know);
      } else if(cq.type==="yesno"){
        s += '<p class="scale">'+escH(UI[L].yes)+' / '+escH(UI[L].no)+' / '+escH(UI[L].no_answer)+'</p>';
      } else if(cq.type==="dropdown"){
        var op = cq.options[L] || [];
        s += '<ul>'+op.map(function(o){ return '<li>'+escH(o)+'</li>'; }).join("")+'</ul>';
      } else {
        s += '<p class="scale">___________________________________________</p>';
      }
      return s;
    }
    PAGES.forEach(function(pg){
      var qs = pg.items
        .filter(function(id){ return !off[id]; })
        .map(function(id){ return QUESTIONS.filter(function(q){return q.id===id;})[0]; }).filter(Boolean);
      if(qs.length){
        html += '<h2>'+escH(pg.title[L])+'</h2>';
        if(pg.intro) html += '<p class="intro">'+escH(pg.intro[L])+'</p>';
        var headerDone = {};
        qs.forEach(function(q){
          html += '<p class="q">'+escH(q.text[L])+'</p>';
          if(q.type==="scale5" || q.type==="scale7"){
            var key = q.scale + (q.type==="scale7"?"7":"5");
            if(!headerDone[key]){
              html += scaleLine(q.type==="scale7"?7:5, SCALES[q.scale][L], q.dkna ? UI[L].dont_know_na : UI[L].dont_know);
              headerDone[key] = true;
            }
          } else if(q.type==="know4"){
            if(!headerDone.know){ html += '<p class="scale">'+escH(KNOW_SCALE[L].join(" / "))+' | '+escH(UI[L].dont_know)+'</p>'; headerDone.know = true; }
          } else if(q.type==="yesno"){
            html += '<p class="scale">'+escH(UI[L].yes)+' / '+escH(UI[L].no)+' / '+escH(UI[L].no_answer)+'</p>';
          } else if(q.type==="gender"){
            html += '<p class="scale">'+escH(q.options[L].join(" / "))+'</p>';
          } else if(q.type==="education"){
            html += '<ul>'+q.options[L].map(function(o){ return '<li>'+escH(o)+'</li>'; }).join("")+'</ul>';
          } else if(q.type==="canton"){
            html += '<p class="scale">'+escH(UI[L].select_placeholder)+' (26 + «'+escH(CANTON_OUTSIDE[L])+'»)</p>';
          } else if(q.type==="age"){
            html += '<p class="scale">____ ____ ____ ____</p>';
          }
        });
      }
      (byPos[pg.key]||[]).forEach(function(cq){
        if(!headerFor(cq)) return;
        html += renderCustom(cq);
      });
      function headerFor(cq){ return true; }
    });
    if(!off.contact){
      html += '<h2>'+escH(PAGES[PAGES.length-1].title[L])+'</h2>'+
        '<p class="intro">'+escH(CONTACT.intro[L])+'</p>'+
        '<ul>'+CONTACT.options[L].map(function(o){ return '<li>'+escH(o)+'</li>'; }).join("")+'</ul>'+
        '<p class="q">'+escH(UI[L].contact_email_q)+'</p><p class="scale">___________________________</p>'+
        '<p class="q">'+escH(UI[L].contact_post_q)+'</p>'+
        '<p class="scale">'+escH(UI[L].contact_first)+': ______________ '+escH(UI[L].contact_last)+': ______________<br>'+
        escH(UI[L].contact_street)+': ______________ '+escH(UI[L].contact_city)+': ______________</p>';
    }
    var outro = tx("outro_text", null);
    html += '<h2>'+escH(UI[L].thanks_title)+'</h2>' + (outro ? '<p>'+escH(outro)+'</p>' : '');

    var doc = '<html xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'+
      '<head><meta charset="utf-8"><title>Fragebogen</title><style>'+
      'body{font-family:Arial,Helvetica,sans-serif;font-size:11pt;line-height:1.4}'+
      'h1{font-size:16pt} h2{font-size:13pt;border-bottom:1pt solid #1d1d1d;padding-bottom:2pt;margin-top:18pt}'+

  function collectConfig(){
    var qs = cfgState.custom_questions
      .map(function(cq,i){ return { id:"CQ"+(i+1), type:cq.type||"scale5c", pos:cq.pos||"about",
                                    text:cq.text||{}, anchors:cq.anchors||{}, options:cq.options||{}, intro:cq.intro||{} }; })
      .filter(function(cq){ return Object.keys(cq.text).length > 0; });
    var cfg = { instrument: cfgState.instrument || "20", custom_questions: qs };
    if(cfgState.color && cfgState.color !== "#e30613") cfg.color = cfgState.color;
    if(cfgState.logo) cfg.logo = cfgState.logo;
    var tx = {};
    ["intro_title","intro_text","outro_text"].forEach(function(k){
      var o = (cfgState.texts||{})[k];
      if(o && Object.keys(o).some(function(L){ return o[L] && o[L].trim(); })){
        tx[k] = {}; Object.keys(o).forEach(function(L){ if(o[L] && o[L].trim()) tx[k][L] = o[L]; });
      }
    });
    if(Object.keys(tx).length) cfg.texts = tx;
    if((cfgState.disabled_questions||[]).length) cfg.disabled_questions = cfgState.disabled_questions;
    if(cfgState.public_panels) cfg.public_panels = cfgState.public_panels;
    return cfg;
  }

  /* ---------- rendering ---------- */
  function segName(s){ return SEGMENT_NAMES[s][lang]; }

  function render(d){
    var total = d.total || 0;
    var segs = d.segments || {};
    var certs = d.certainty_by_segment || {};
    var counts = [1,2,3,4].map(function(s){ return segs[String(s)] || 0; });

    /* --- Overview --- */
    var lastTxt = d.last_response_at ? timeAgo(new Date(d.last_response_at)) : "—";
    var firstTxt = d.first_response_at ? new Date(d.first_response_at).toLocaleDateString() : "—";
    var avgMin = d.avg_duration_sec ? (Math.round(d.avg_duration_sec/6)/10)+" min" : "—";
    var medMin = d.median_duration_sec ? (Math.round(d.median_duration_sec/6)/10)+" min" : "—";
    document.getElementById("kpis").innerHTML =
      kpi(total, T().k_total) + kpi(firstTxt, T().k_first) + kpi(lastTxt, T().k_last) +
      kpi(avgMin, T().k_dur) + kpi(medMin, T().k_median) +
      kpi(d.avg_age != null ? d.avg_age : "—", T().k_age);

    var ageRows = d.segment_by_age || [], genderRows = d.segment_by_gender || [], eduRows = d.segment_by_edu || [];
    renderOverallDist("ovAge", ageRows, function(r){return r.grp;}, ["15-34","35-54","55+","na"], function(g){return T().age[g]||g;});
    renderOverallDist("ovGender", genderRows, function(r){return r.gender==null?"null":String(r.gender);}, ["1","2","3","null"], function(g){return T().gender[g]||g;});
    renderOverallDist("ovEdu", eduRows, function(r){return r.grp;}, ["low","mid","high","na"], function(g){return T().edu[g]||g;});

    /* --- Segments --- */
    if(total===0){
      document.getElementById("segBars").innerHTML = '<div class="empty">'+esc(T().nodata)+'</div>';
    } else {
      document.getElementById("segBars").innerHTML = [1,2,3,4].map(function(s,i){
        var c = counts[i], pct = total? Math.round(c/total*100):0;
        var ct = certs[String(s)] != null ? ' · '+Math.round(certs[String(s)]*100)+'% '+T().certainty : '';
        return '<div class="segrow">'+
          '<div class="segname"><span class="swatch" style="background:'+SEGC[s]+'"></span>'+esc(segName(s))+'</div>'+
          '<div class="pbar"><span style="width:'+(total? c/total*100:0)+'%;background:'+SEGC[s]+'"></span></div>'+
          '<div class="segval"><b>'+c+'</b> · '+pct+'%'+ct+'</div>'+
        '</div>';
      }).join("");
    }
    renderSegDist("sgAge", ageRows, function(r){return r.grp;}, ["15-34","35-54","55+","na"], function(g){return T().age[g]||g;});
    renderSegDist("sgGender", genderRows, function(r){return r.gender==null?"null":String(r.gender);}, ["1","2","3","null"], function(g){return T().gender[g]||g;});
    renderSegDist("sgEdu", eduRows, function(r){return r.grp;}, ["low","mid","high","na"], function(g){return T().edu[g]||g;});
    renderSegMeans(d);
    renderSegRegion(d.segment_by_canton || []);

    /* --- Per-question --- */
    renderItems(d.item_dist || []);
  }

  /* Overall distribution of one variable (summed across segments) */
  function renderOverallDist(elId, rows, keyFn, order, labelFn){
    var by = {}; var total = 0;
    rows.forEach(function(r){ var g = keyFn(r); by[g] = (by[g]||0) + r.c; total += r.c; });
    var el = document.getElementById(elId);
    if(total===0){ el.innerHTML = '<div class="empty">'+esc(T().nodata)+'</div>'; return; }
    el.innerHTML = order.filter(function(g){ return by[g]; }).map(function(g){
      var c = by[g], pct = Math.round(c/total*100);
      return '<div class="distrow"><div class="dl">'+esc(labelFn(g))+'</div>'+
        '<div class="pbar"><span style="width:'+(c/total*100)+'%;background:'+SEGC[1]+'"></span></div>'+
        '<div class="dv"><b>'+c+'</b> · '+pct+'%</div></div>';
    }).join("");
  }

  /* One variable per segment: 4 rows (segments), 100% stacked by category */
  function renderSegDist(elId, rows, keyFn, order, labelFn){
    var by = {}; // segment -> category -> c
    rows.forEach(function(r){
      var g = keyFn(r);
      by[r.segment] = by[r.segment] || {};
      by[r.segment][g] = (by[r.segment][g]||0) + r.c;
    });
    var el = document.getElementById(elId);
    var any = false;
    var html = [1,2,3,4].map(function(s){
      var o = by[s] || {}; var tot = 0;
      order.forEach(function(g){ tot += o[g]||0; });
      if(tot===0) return "";
      any = true;
      var stack = order.map(function(g,gi){
        var c = o[g]||0, w = c/tot*100;
        if(w<=0) return "";
        var lbl = w>=12 ? '<span class="pl'+(gi>=order.length-2?' dk1':'')+'" style="width:100%">'+Math.round(w)+'%</span>' : '';
        return '<span style="width:'+w+'%;background:'+rampColor(order.length-gi, order.length)+'" title="'+esc(labelFn(g))+': '+c+'">'+lbl+'</span>';
      }).join("");
      return '<div class="distrow"><div class="dl"><span class="swatch" style="background:'+SEGC[s]+';display:inline-block;vertical-align:-1px;margin-right:6px"></span>'+esc(segName(s))+'</div>'+
             '<div class="dtrack">'+stack+'</div><div class="dv">'+tot+'</div></div>';
    }).join("");
    html += '<div class="qlegend" style="margin-top:6px">'+order.map(function(g,gi){
      return '<span><i style="background:'+rampColor(order.length-gi, order.length)+'"></i>'+esc(labelFn(g))+'</span>';
    }).join("")+'</div>';
    el.innerHTML = any ? html : '<div class="empty">'+esc(T().nodata)+'</div>';
  }

  /* Mean values per segment for trust / interest / POL / REL / literacy */
  function renderSegMeans(d){
    var el = document.getElementById("sgMeans");
    var rows = d.means_by_segment || [];
    var byK = {};
    rows.forEach(function(r){ byK[r.k] = byK[r.k] || {}; byK[r.k][r.segment] = r; });
    var lit = d.idxsl_by_segment || {};
    var metrics = [
      {k:"F2003", label:T().m_trust, max:5},
      {k:"F0505", label:T().m_interest, max:5},
      {k:"POL", label:T().m_pol, max:7},
      {k:"REL", label:T().m_rel, max:5},
      {k:"__lit", label:T().m_lit, max:2}
    ];
    var any = false;
    var html = metrics.map(function(m){
      var vals = [1,2,3,4].map(function(s){
        if(m.k === "__lit") return lit[String(s)] ? {m:+lit[String(s)].m, n:lit[String(s)].n} : null;
        var r = (byK[m.k]||{})[s];
        return r ? {m:+r.m, n:r.n} : null;
      });
      if(!vals.some(function(v){ return v; })) return "";
      any = true;
      var bars = [1,2,3,4].map(function(s,i){
        var v = vals[i];
        if(!v) return "";
        return '<div class="mbar"><div class="sn"><span class="swatch" style="background:'+SEGC[s]+'"></span>'+esc(segName(s))+'</div>'+
          '<div class="mtrack" style="background:'+mixWhite(KEYCOLOR,0.94)+'"><i style="width:'+(v.m/m.max*100)+'%;background:'+SEGC[s]+'"></i></div>'+
          '<div class="mv">'+v.m.toFixed(1)+'</div></div>';
      }).join("");
      return '<div class="meanrow"><div class="ml">'+esc(m.label)+'</div><div class="mbars">'+bars+'</div></div>';
    }).join("");
    el.innerHTML = any ? html : '<div class="empty">'+esc(T().nodata)+'</div>';
  }

  /* Language region per segment, derived from canton */
  function renderSegRegion(rows){
    var mapped = rows.map(function(r){
      var reg = r.grp === "na" ? "na" : (REGION_OF[r.grp] || "na");
      return { grp: reg, segment: r.segment, c: r.c };
    });
    renderSegDist("sgRegion", mapped, function(r){ return r.grp; },
      ["de_reg","fr_reg","it_reg","ext","na"], function(g){ return T().reg[g] || g; });
  }
  function kpi(n,l){ return '<div class="kpi"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }

  function drawDonut(counts, total){
    var svg = document.getElementById("donut");
    svg.innerHTML = '<circle cx="21" cy="21" r="15.9155" fill="none" stroke="#fdece3" stroke-width="6"/>';
    if(total===0){ svg.innerHTML += '<text x="21" y="23" text-anchor="middle" font-size="6" fill="#5f5f5f">0</text>'; return; }
    var offset = 25;
    [1,2,3,4].forEach(function(s,i){
      var len = counts[i]/total*100;
      if(len<=0) return;
      svg.innerHTML += '<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+SEGC[s]+'" stroke-width="6" stroke-dasharray="'+len+' '+(100-len)+'" stroke-dashoffset="'+offset+'"/>';
      offset -= len;
    });
    svg.innerHTML += '<text x="21" y="20.5" text-anchor="middle" font-size="8" font-weight="700" fill="#1d1d1d" font-family="Bebas Neue">'+total+'</text>'+
                     '<text x="21" y="26" text-anchor="middle" font-size="3" fill="#5f5f5f">total</text>';
  }

  function renderBreakdown(elId, rows, keyFn, order, labelFn, sortByTotal){
    var byG = {};
    rows.forEach(function(r){
      var g = keyFn(r);
      byG[g] = byG[g] || {total:0, seg:{1:0,2:0,3:0,4:0}};
      byG[g].seg[r.segment] += r.c; byG[g].total += r.c;
    });
    var keys = order ? order.filter(function(g){ return byG[g]; }) : Object.keys(byG);
    if(sortByTotal) keys.sort(function(a,b){
      if(a==="na") return 1; if(b==="na") return -1;
      return byG[b].total - byG[a].total;
    });
    var el = document.getElementById(elId);
    if(keys.length===0){ el.innerHTML = '<div class="empty">'+esc(T().nodata)+'</div>'; return; }
    el.innerHTML = keys.map(function(g){
      var o = byG[g];
      var stack = [1,2,3,4].map(function(s){
        var c = o.seg[s], w = o.total? (c/o.total*100):0;
        return w>0 ? '<span style="width:'+w+'%;background:'+SEGC[s]+'"></span>' : '';
      }).join("");
      return '<div class="barcol"><div class="cap">'+esc(labelFn(g))+' <span>· '+o.total+'</span></div>'+
             '<div class="stack">'+stack+'</div></div>';
    }).join("");
  }

  /* ---------- per-question distributions ---------- */
  function rampColor(i, n){       // 1..n -> light..dark tint of the key colour
    if(n===1) return KEYCOLOR;
    var pct = 0.85 - (i-1)/(n-1)*0.85;     // 85% white ... 0%
    return mixWhite(KEYCOLOR, pct);
  }
  var GRAY_DK = "#9a9a9a", GRAY_MISS = "#dddddd";
  function barSeg(widthPct, color, darkText, title){
    var lbl = widthPct >= 9 ? '<span class="pl'+(darkText?' dk1':'')+'" style="width:100%">'+Math.round(widthPct)+'%</span>' : '';
    return '<span style="width:'+widthPct+'%;background:'+color+'"'+(title?' title="'+title+'"':'')+'>'+lbl+'</span>';
  }

  function renderItems(dist){
    var byItem = {};
    dist.forEach(function(r){
      byItem[r.k] = byItem[r.k] || {};
      var v = (r.v === null || r.v === undefined) ? "null" : String(r.v);
      byItem[r.k][v] = (byItem[r.k][v] || 0) + r.c;
    });

    document.getElementById("qLegend").innerHTML =
      '<span><i style="background:#fcd9ca"></i>1 → <i style="background:#e30613"></i>max</span>'+
      '<span><i style="background:'+GRAY_DK+'"></i>'+esc(T().dk)+'</span>'+
      '<span><i style="background:'+GRAY_MISS+'"></i>'+esc(T().missing)+'</span>';

    var html = "";
    PAGES.forEach(function(pg){
      var qs = pg.items.map(function(id){ return QUESTIONS.filter(function(q){return q.id===id;})[0]; })
        .filter(function(q){ return q && ["scale5","scale7","know4","yesno"].indexOf(q.type) !== -1; });
      if(qs.length===0) return;
      html += '<h3>'+esc(pg.title[lang])+'</h3>';
      qs.forEach(function(q){
        var counts = byItem[q.id] || {};
        var n = q.type==="scale7" ? 7 : q.type==="know4" ? 4 : q.type==="yesno" ? 2 : 5;
        var totalAll = 0, valid = 0, sum = 0;
        Object.keys(counts).forEach(function(v){ totalAll += counts[v]; });
        var segs = "";
        for(var i=1;i<=n;i++){
          var c = counts[String(i)] || 0;
          valid += c; sum += i*c;
          if(c>0 && totalAll>0) segs += barSeg(c/totalAll*100, rampColor(i,n), (i-1)/(Math.max(n-1,1)) < 0.5, i+': '+c);
        }
        var dk = counts["98"] || 0;
        if(dk>0 && totalAll>0) segs += barSeg(dk/totalAll*100, GRAY_DK, false, "");
        var miss = counts["null"] || 0;
        if(miss>0 && totalAll>0) segs += barSeg(miss/totalAll*100, GRAY_MISS, true, "");
        var meta = totalAll===0 ? "—" :
          (q.type==="yesno"
            ? (valid>0 ? Math.round((counts["1"]||0)/valid*100)+'% '+T().yes : "—") + ' · n='+totalAll
            : (valid>0 ? T().mean+' '+(Math.round(sum/valid*100)/100) : "—") + ' · n='+totalAll);
        html += '<div class="qrow"><div class="qt">'+esc(q.text[lang])+'</div>'+
                '<div class="qstack">'+segs+'</div>'+
                '<div class="qmeta">'+meta+'</div></div>';
      });
    });
    // customer-defined questions
    if(cfgState.custom_questions.length){
      html += '<h3>'+esc(T().p_custom_items)+'</h3>';
      cfgState.custom_questions.forEach(function(cq, i){
        var id = "CQ"+(i+1);
        var label = (cq.text && (cq.text[lang] || cq.text.de || cq.text.en || cq.text.fr || cq.text.it)) || id;
        var counts = byItem[id] || {};
        var totalAll = 0; Object.keys(counts).forEach(function(v){ totalAll += counts[v]; });
        if(cq.type === "text"){
          var answered = totalAll - (counts["null"] || 0);
          html += '<div class="qrow"><div class="qt">'+esc(label)+'</div><div></div>'+
                  '<div class="qmeta">'+fillS(T().cq_answered, {n: answered})+'</div></div>';
          return;
        }
        var n = cq.type === "yesno" ? 2 : (cq.type === "scale7c" ? 7 : (cq.type === "dropdown" ? ((cq.options && (cq.options.de||cq.options.en||cq.options.fr||cq.options.it)) || []).length || 5 : 5));
        var segs = "", valid = 0, sum = 0;
        for(var v=1; v<=n; v++){
          var c = counts[String(v)] || 0; valid += c; sum += v*c;
          if(c>0 && totalAll>0) segs += barSeg(c/totalAll*100, rampColor(v,n), (v-1)/(Math.max(n-1,1)) < 0.5, "");
        }
        var dk = counts["98"] || 0;
        if(dk>0 && totalAll>0) segs += barSeg(dk/totalAll*100, GRAY_DK, false, "");
        var miss = counts["null"] || 0;
        if(miss>0 && totalAll>0) segs += barSeg(miss/totalAll*100, GRAY_MISS, true, "");
        var meta = totalAll===0 ? "—" :
          (cq.type==="yesno"
            ? (valid>0 ? Math.round((counts["1"]||0)/valid*100)+'% '+T().yes : "—") + ' · n='+totalAll
            : (valid>0 ? T().mean+' '+(Math.round(sum/valid*100)/100) : "—") + ' · n='+totalAll);
        html += '<div class="qrow"><div class="qt">'+esc(label)+'</div>'+
                '<div class="qstack">'+segs+'</div><div class="qmeta">'+meta+'</div></div>';
      });
    }
    document.getElementById("itemPanels").innerHTML = html || '<div class="empty">'+esc(T().nodata)+'</div>';
  }

  /* ---------- CSV export ---------- */
  function downloadCsv(){
    if(!sb || !surveyId) return;
    sb.rpc("survey_export_secured", {p_survey_id: surveyId, p_code: accessCode}).then(function(res){
      if(res.error || !res.data) return;
      var rows = res.data;
      var itemIds = QUESTIONS.map(function(q){ return q.id; });
      var base = ["id","created_at","survey_id","language","segment","segment_label",
                  "prob_sciencephiles","prob_critically_interested","prob_passive_supporters","prob_disengaged",
                  "idx_sl","n_missing","age_year","gender","education","canton","duration_sec","contact_type"];
      var contactCols = ["email","first","last","street","city"];
      var header = base.concat(itemIds.map(function(i){ return "ans_"+i; }))
                       .concat(contactCols.map(function(c){ return "contact_"+c; }));
      var lines = [header.join(",")];
      rows.forEach(function(r){
        var vals = base.map(function(k){ return csvCell(r[k]); });
        var a = r.answers || {};
        itemIds.forEach(function(i){ vals.push(csvCell(a[i])); });
        var ct = r.contact || {};
        contactCols.forEach(function(c){ vals.push(csvCell(ct[c])); });
        lines.push(vals.join(","));
      });
      var blob = new Blob(["\uFEFF"+lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "responses_"+surveyId+"_"+new Date().toISOString().slice(0,10)+".csv";
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    });
  }
  function csvCell(v){
    if(v === null || v === undefined) return "";
    var s = String(v);
    if(/[",\n\r;]/.test(s)) s = '"'+s.replace(/"/g,'""')+'"';
    return s;
  }

  /* ---------- delete with confirmation ---------- */
  function wireDelete(){
    var box = document.getElementById("confirmBox");
    var msg = document.getElementById("delMsg");
    document.getElementById("delBtn").onclick = function(){ box.hidden = false; msg.textContent = ""; };
    document.getElementById("delNo").onclick = function(){ box.hidden = true; };
    document.getElementById("delYes").onclick = function(){
      box.hidden = true;
      sb.rpc("survey_delete_secured", {p_survey_id: surveyId, p_code: accessCode}).then(function(res){
        if(res.error || res.data === null){ msg.textContent = T().gate_err_net; return; }
        msg.textContent = fillS(T().deleted, {n: res.data});
        load();
      });
    };
  }

  function timeAgo(dt){
    var s = Math.round((Date.now()-dt.getTime())/1000);
    if(s<60) return s+"s"; if(s<3600) return Math.round(s/60)+"m";
    if(s<86400) return Math.round(s/3600)+"h"; return Math.round(s/86400)+"d";
  }
})();
