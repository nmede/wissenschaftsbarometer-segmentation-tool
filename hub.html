<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin.Hub — Wissenschaftsbarometer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');
@font-face{font-family:"Akkurat Pro";src:url("fonts/AkkuratPro-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
:root{--red:#e30613;--red-10:#fdece3;--ink:#1d1d1d;--ink-60:#5f5f5f;--line:#e2e2e2;--white:#fff;
      --s1:#e30613;--s2:#ed694b;--s3:#f6af95;--s4:#fcd9ca}
*{box-sizing:border-box}
body{margin:0;font-family:"Akkurat Pro","Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--white);font-size:14.5px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 22px 70px}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:14px;border-bottom:3px solid var(--ink);margin-bottom:20px}
.brandbar img{height:36px}
.langbar{display:flex;border:2px solid var(--ink)}
.langbar button{border:0;background:#fff;font:inherit;font-size:12px;font-weight:700;padding:5px 10px;cursor:pointer}
.langbar button + button{border-left:2px solid var(--ink)}
.langbar button[aria-pressed="true"]{background:var(--ink);color:#fff}
.gate{max-width:420px;margin:10vh auto;border:2px solid var(--ink);padding:32px 30px}
.gate h1{font-family:"Bebas Neue",sans-serif;font-size:38px;margin:0 0 4px}
.gate h1 b{color:var(--red)}
.gate p{color:var(--ink-60);font-size:14px;margin:0 0 18px}
.gate input{width:100%;font:inherit;font-size:15px;padding:11px 13px;border:2px solid var(--ink);margin-bottom:14px}
.gate input:focus{outline:none;border-color:var(--red)}
.btn{font:inherit;font-weight:700;font-size:15px;border:2px solid var(--red);padding:12px 20px;cursor:pointer;background:var(--red);color:#fff;width:100%}
.err{color:var(--red);font-weight:700;font-size:13px;margin-top:10px;min-height:16px}
.title{font-family:"Bebas Neue",sans-serif;font-size:40px;line-height:1}
.title b{color:var(--red)}
.sub{color:var(--ink-60);font-size:13px;margin:4px 0 20px}
table{width:100%;border-collapse:collapse;border:2px solid var(--ink)}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:10px 12px;border-bottom:2px solid var(--ink);background:var(--red-10)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.mono{font-family:monospace;font-size:12.5px}
.ok{color:#1f7a3d;font-weight:700}
.no{color:var(--ink-60)}
.toolbtn{background:#fff;border:2px solid var(--ink);color:var(--ink);font:inherit;font-size:11.5px;font-weight:700;padding:5px 11px;cursor:pointer;letter-spacing:.03em;text-transform:uppercase}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbtn:hover{background:var(--line)}
.toolbtn:disabled{opacity:.4;cursor:not-allowed}
.detail{background:#fafafa;border-bottom:1px solid var(--line)}
.detail td{padding:14px 16px}
.segrow{display:flex;align-items:center;gap:12px;margin-bottom:8px;max-width:640px}
.segname{width:170px;font-weight:700;font-size:12.5px;display:flex;gap:8px;align-items:center}
.swatch{width:11px;height:11px;border:1px solid var(--ink)}
.track{flex:1;height:18px;background:var(--red-10)}
.trackfill{height:100%;border-right:1px solid var(--ink)}
.segval{width:90px;text-align:right;font-size:12px;color:var(--ink-60)}
.segval b{color:var(--ink)}
.note{color:var(--ink-60);font-size:13px}
.foot{margin-top:22px;font-size:12px;color:var(--ink-60);border-top:1px solid var(--line);padding-top:12px}
.panel-lite{border:2px solid var(--ink);padding:16px 18px;margin-bottom:16px}
.cb-head{font-family:"Bebas Neue",sans-serif;font-size:22px;letter-spacing:.03em;margin-bottom:10px}
.cb-row{display:flex;gap:8px;flex-wrap:wrap}
.cb-row input{font:inherit;font-size:13.5px;padding:9px 11px;border:2px solid var(--ink);flex:1;min-width:160px}
.cb-row input:focus{outline:none;border-color:var(--red)}
.codeout{margin-top:12px;background:var(--red-10);border:2px solid var(--red);padding:12px 14px;font-size:13.5px;line-height:1.5}
.codeout code{font-size:15px;font-weight:700;background:#fff;padding:2px 8px;border:1px solid var(--ink);user-select:all}
@media(max-width:820px){table,thead,tbody,tr,th,td{display:block}thead{display:none}td{border-bottom:0}tr{border-bottom:2px solid var(--ink);padding:8px 0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar">
    <img src="img/logo.png" alt="Wissenschaftsbarometer">
    <div class="langbar" id="langbar">
      <button data-lang="de" aria-pressed="true">DE</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <div id="gate" class="gate">
    <h1>Admin<b>.</b>Hub</h1>
    <p id="gIntro"></p>
    <input id="gCode" type="password" placeholder="••••••••" autocomplete="off">
    <button class="btn" id="gEnter"></button>
    <div class="err" id="gErr"></div>
  </div>

  <div id="app" hidden>
    <div class="title" id="hTitle"></div>
    <div class="sub" id="hSub"></div>
    <div class="panel-lite" id="createBox">
      <div class="cb-head" id="cbTitle"></div>
      <div class="cb-row">
        <input id="nSurvey" placeholder="museum-basel-2026" autocomplete="off">
        <input id="nName" placeholder="Museum Basel" autocomplete="off">
        <input id="nCode" placeholder="" autocomplete="off">
        <button class="toolbtn" id="nGen"></button>
        <button class="toolbtn" id="nCreate" style="border-color:var(--red);color:var(--red)"></button>
      </div>
      <div class="codeout" id="codeOut" hidden></div>
      <div class="err" id="cErr"></div>
    </div>
    <div style="margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="toolbtn" id="refreshBtn"></button><button class="toolbtn" id="logoutBtn"></button></div>
    <table id="tbl"><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table>
    <div class="foot" id="foot"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/content.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  "use strict";
  var SEGC = {1:"#e30613",2:"#ed694b",3:"#f6af95",4:"#fcd9ca"};
  var D = {
    de:{gi:"Zentraler Zugang für das Wissenschaftsbarometer-Team. Master-Code eingeben.",
        open:"Hub öffnen", bad:"Code nicht erkannt.", nocfg:"Backend nicht konfiguriert.", net:"Server nicht erreichbar.", checking:"Prüfe …",
        title:"Kunden & Surveys", sub:"{n} Surveys · Datenzugriff nur bei erteilter Freigabe (in der Datenbank erzwungen).",
        refresh:"Aktualisieren",
        th:["Survey","Name","Antworten","Letzte Antwort","Segmentation","Freigabe","Öffentl. Link","Aktionen"],
        consent_yes:"erteilt {d}", consent_no:"—", share_yes:"aktiv", share_no:"—",
        b_sum:"Auswertung", b_csv:"CSV-Export", b_dash:"Dashboard", b_reset:"Code neu setzen", b_logout:"Abmelden",
        cb_title:"Neuen Kunden anlegen", cb_gen:"Code erzeugen", cb_create:"Anlegen",
        cb_err_input:"Survey-ID (min. 3 Zeichen) und Code (min. 6 Zeichen) erforderlich.",
        cb_err_net:"Anlegen fehlgeschlagen.",
        code_once:"Zugangscode für {s}: {c} — Bitte jetzt kopieren und sicher an den Kunden übermitteln. Der Code wird nur dieses eine Mal angezeigt und ist danach nicht mehr abrufbar.",
        copy:"Kopieren", copied:"Kopiert!",
        reset_confirm:"Neuen Zugangscode für {s} erzeugen? Der bisherige Code wird sofort ungültig.",
        b_del:"Kunde löschen",
        del_warn:"ACHTUNG: Der Kunde {s} und ALLE seine Antworten ({n}) werden unwiderruflich gelöscht.",
        del_prompt:"Zur Bestätigung bitte den Master-Code eingeben:",
        del_bad:"Master-Code nicht erkannt — nichts gelöscht.",
        del_done:"{s} gelöscht ({n} Antworten entfernt).",
        no_consent:"Keine Datenfreigabe erteilt — Auswertung und Export sind gesperrt.",
        certainty:"Ø Zuordnungssicherheit", total:"Antworten",
        foot:"Auswertungen und Exporte sind nur für Surveys mit erteilter Datenfreigabe möglich; Exporte enthalten keine Kontaktangaben. Master-Code ändern: select set_admin_code('…'); im SQL-Editor."},
    en:{gi:"Central access for the Science Barometer team. Enter the master code.",
        open:"Open hub", bad:"Code not recognised.", nocfg:"Backend not configured.", net:"Could not reach the server.", checking:"Checking …",
        title:"Customers & surveys", sub:"{n} surveys · data access only with granted consent (enforced in the database).",
        refresh:"Refresh",
        th:["Survey","Name","Responses","Last response","Segmentation","Consent","Public link","Actions"],
        consent_yes:"granted {d}", consent_no:"—", share_yes:"active", share_no:"—",
        b_sum:"Summary", b_csv:"CSV export", b_dash:"Dashboard", b_reset:"Reset code", b_logout:"Log out",
        cb_title:"Create new customer", cb_gen:"Generate code", cb_create:"Create",
        cb_err_input:"Survey ID (min. 3 chars) and code (min. 6 chars) required.",
        cb_err_net:"Creation failed.",
        code_once:"Access code for {s}: {c} — Copy it now and transmit it securely to the customer. The code is shown only this once and cannot be retrieved later.",
        copy:"Copy", copied:"Copied!",
        reset_confirm:"Generate a new access code for {s}? The current code becomes invalid immediately.",
        b_del:"Delete customer",
        del_warn:"WARNING: Customer {s} and ALL of their responses ({n}) will be deleted irreversibly.",
        del_prompt:"Please re-enter the master code to confirm:",
        del_bad:"Master code not recognised — nothing deleted.",
        del_done:"{s} deleted ({n} responses removed).",
        no_consent:"No data-use consent granted — summary and export are locked.",
        certainty:"Avg. assignment certainty", total:"Responses",
        foot:"Summaries and exports are only available for surveys with granted consent; exports contain no contact details. Rotate the master code with select set_admin_code('…'); in the SQL editor."}
  };
  var lang = "de", adminCode = null, surveys = [];
  var _cfg = (typeof CONFIG !== "undefined" && CONFIG) ? CONFIG : {SUPABASE_URL:"",SUPABASE_ANON_KEY:""};
  var sb = null;
  try{
    if(_cfg.SUPABASE_URL && _cfg.SUPABASE_URL.indexOf("YOUR-PROJECT") === -1 && window.supabase)
      sb = window.supabase.createClient(_cfg.SUPABASE_URL, _cfg.SUPABASE_ANON_KEY);
  }catch(e){}
  var isDemo = new URLSearchParams(location.search).get("demo")==="1";

  function T(){ return D[lang]; }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  function fillS(s,m){ return s.replace(/\{(\w+)\}/g,function(_,k){return m[k];}); }
  function applyStatic(){
    document.getElementById("gIntro").textContent = T().gi;
    document.getElementById("gEnter").textContent = T().open;
    document.getElementById("refreshBtn").textContent = T().refresh;
    document.getElementById("foot").textContent = T().foot;
    document.getElementById("hTitle").innerHTML = esc(T().title)+'<b>.</b>';
    document.getElementById("thead").innerHTML = T().th.map(function(x){return '<th>'+esc(x)+'</th>';}).join("");
    document.getElementById("cbTitle").textContent = T().cb_title;
    document.getElementById("nGen").textContent = T().cb_gen;
    document.getElementById("nCreate").textContent = T().cb_create;
    document.getElementById("nCode").placeholder = T().cb_gen;
  }
  document.getElementById("langbar").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    lang = b.getAttribute("data-lang");
    Array.prototype.forEach.call(this.querySelectorAll("button"), function(x){ x.setAttribute("aria-pressed", x===b?"true":"false"); });
    applyStatic(); if(surveys.length) renderList();
  });

  applyStatic();
  document.getElementById("gEnter").onclick = enter;
  document.getElementById("gCode").addEventListener("keydown", function(e){ if(e.key==="Enter") enter(); });

  if(isDemo){
    document.getElementById("gate").hidden = true;
    document.getElementById("app").hidden = false;
    surveys = [
      {survey_id:"ikmz-scientifica", display_name:"IKMZ Scientifica", created_at:"2026-07-19", instrument:"20",
       consent_granted:true, consent_at:"2026-07-22", has_share:true, n_responses:212, last_response_at:new Date(Date.now()-360000).toISOString()},
      {survey_id:"museum-basel-2026", display_name:"Museum Basel", created_at:"2026-07-02", instrument:"20",
       consent_granted:false, consent_at:null, has_share:false, n_responses:58, last_response_at:new Date(Date.now()-86400000*2).toISOString()}
    ];
    renderList();
    wireCreate();
    document.getElementById("logoutBtn").textContent = T().b_logout;
    document.getElementById("logoutBtn").onclick = function(){ location.href = location.pathname; };
  }

  function enter(){
    var err = document.getElementById("gErr");
    var code = document.getElementById("gCode").value;
    if(!sb){ err.textContent = T().nocfg; return; }
    err.textContent = T().checking;
    adminCode = code;
    sb.rpc("admin_list_surveys", {p_admin_code: code}).then(function(res){
      if(res.error || res.data === null){ err.textContent = T().bad; return; }
      surveys = res.data || [];
      document.getElementById("gate").hidden = true;
      document.getElementById("app").hidden = false;
      renderList();
      wireCreate();
      document.getElementById("refreshBtn").onclick = reload;
      document.getElementById("logoutBtn").textContent = T().b_logout;
      document.getElementById("logoutBtn").onclick = function(){ adminCode = null; location.href = location.pathname; };
    }).catch(function(){ err.textContent = T().net; });
  }
  function genCode(){
    var chars = "abcdefghjkmnpqrstuvwxyz23456789";
    var out = "";
    var rnd = new Uint32Array(12); crypto.getRandomValues(rnd);
    for(var i=0;i<12;i++) out += chars[rnd[i] % chars.length];
    return out;
  }
  function showCodeOnce(surveyId, code){
    var box = document.getElementById("codeOut");
    box.hidden = false;
    box.innerHTML = esc(fillS(T().code_once, {s: surveyId, c: ""})).replace(": ", ": <code>"+esc(code)+"</code> ") +
      ' <button class="toolbtn" id="codeCopy">'+T().copy+'</button>';
    document.getElementById("codeCopy").onclick = function(){
      var b = this;
      try { navigator.clipboard.writeText(code).then(function(){ b.textContent = T().copied;
        setTimeout(function(){ b.textContent = T().copy; }, 1800); }); } catch(e){}
    };
  }
  function wireCreate(){
    document.getElementById("nGen").onclick = function(){ document.getElementById("nCode").value = genCode(); };
    document.getElementById("nCreate").onclick = function(){
      var err = document.getElementById("cErr"); err.textContent = "";
      var sid = document.getElementById("nSurvey").value.trim();
      var name = document.getElementById("nName").value.trim() || null;
      var code = document.getElementById("nCode").value;
      if(sid.length < 3 || code.length < 6){ err.textContent = T().cb_err_input; return; }
      if(isDemo){ showCodeOnce(sid, code); return; }
      sb.rpc("admin_set_survey", {p_admin_code: adminCode, p_survey_id: sid, p_name: name, p_code: code})
        .then(function(res){
          if(res.error || res.data !== true){ err.textContent = T().cb_err_input; return; }
          showCodeOnce(sid, code);
          document.getElementById("nSurvey").value = "";
          document.getElementById("nName").value = "";
          document.getElementById("nCode").value = "";
          reload();
        }).catch(function(){ err.textContent = T().cb_err_net; });
    };
  }
  function resetCode(s){
    if(!confirm(fillS(T().reset_confirm, {s: s.survey_id}))) return;
    var code = genCode();
    if(isDemo){ showCodeOnce(s.survey_id, code); return; }
    sb.rpc("admin_set_survey", {p_admin_code: adminCode, p_survey_id: s.survey_id, p_name: null, p_code: code})
      .then(function(res){
        if(!res.error && res.data === true) showCodeOnce(s.survey_id, code);
      });
  }
  function deleteCustomer(s){
    if(!confirm(fillS(T().del_warn, {s: s.survey_id, n: s.n_responses||0}))) return;
    var code = prompt(T().del_prompt);
    if(code === null || code === "") return;
    if(isDemo){
      alert(fillS(T().del_done, {s: s.survey_id, n: s.n_responses||0}));
      surveys = surveys.filter(function(x){ return x.survey_id !== s.survey_id; });
      renderList(); return;
    }
    sb.rpc("admin_delete_survey", {p_admin_code: code, p_survey_id: s.survey_id}).then(function(res){
      if(res.error || res.data === null){ alert(T().del_bad); return; }
      alert(fillS(T().del_done, {s: s.survey_id, n: res.data}));
      reload();
    }).catch(function(){ alert(T().del_bad); });
  }
  function reload(){
    if(isDemo) return;
    sb.rpc("admin_list_surveys", {p_admin_code: adminCode}).then(function(res){
      if(!res.error && res.data){ surveys = res.data; renderList(); }
    });
  }

  function renderList(){
    document.getElementById("hSub").textContent = fillS(T().sub, {n: surveys.length});
    var tb = document.getElementById("tbody");
    tb.innerHTML = "";
    surveys.forEach(function(s, i){
      var tr = document.createElement("tr");
      var consent = s.consent_granted
        ? '<span class="ok">'+esc(fillS(T().consent_yes,{d: s.consent_at ? new Date(s.consent_at).toLocaleDateString() : ""}))+'</span>'
        : '<span class="no">'+T().consent_no+'</span>';
      tr.innerHTML =
        '<td class="mono">'+esc(s.survey_id)+'</td>'+
        '<td>'+esc(s.display_name||"")+'</td>'+
        '<td><b>'+(s.n_responses||0)+'</b></td>'+
        '<td>'+(s.last_response_at? timeAgo(new Date(s.last_response_at)) : "—")+'</td>'+
        '<td>'+esc((s.instrument||"20")+" Items").replace("1 Items","1 Item")+'</td>'+
        '<td>'+consent+'</td>'+
        '<td>'+(s.has_share? '<span class="ok">'+T().share_yes+'</span>' : '<span class="no">'+T().share_no+'</span>')+'</td>'+
        '<td><div class="actions">'+
            '<button class="toolbtn" data-sum="'+i+'"'+(s.consent_granted?'':' disabled')+'>'+T().b_sum+'</button>'+
            '<button class="toolbtn" data-csv="'+i+'"'+(s.consent_granted?'':' disabled')+'>'+T().b_csv+'</button>'+
            '<a class="toolbtn" style="text-decoration:none" href="dashboard.html?survey='+encodeURIComponent(s.survey_id)+'" target="_blank">'+T().b_dash+'</a>'+
            '<button class="toolbtn" data-reset="'+i+'">'+T().b_reset+'</button>'+
            '<button class="toolbtn" data-del="'+i+'" style="border-color:var(--red);color:var(--red)">'+T().b_del+'</button>'+
            '</div></td>';
      tb.appendChild(tr);
    });
    Array.prototype.forEach.call(tb.querySelectorAll("[data-sum]"), function(btn){
      btn.onclick = function(){ toggleSummary(+btn.getAttribute("data-sum"), btn); };
    });
    Array.prototype.forEach.call(tb.querySelectorAll("[data-csv]"), function(btn){
      btn.onclick = function(){ exportCsv(surveys[+btn.getAttribute("data-csv")].survey_id); };
    });
    Array.prototype.forEach.call(tb.querySelectorAll("[data-reset]"), function(btn){
      btn.onclick = function(){ resetCode(surveys[+btn.getAttribute("data-reset")]); };
    });
    Array.prototype.forEach.call(tb.querySelectorAll("[data-del]"), function(btn){
      btn.onclick = function(){ deleteCustomer(surveys[+btn.getAttribute("data-del")]); };
    });
  }

  function toggleSummary(i, btn){
    var tb = document.getElementById("tbody");
    var existing = tb.querySelector('tr.detail[data-for="'+i+'"]');
    if(existing){ existing.remove(); return; }
    var tr = document.createElement("tr");
    tr.className = "detail"; tr.setAttribute("data-for", i);
    tr.innerHTML = '<td colspan="8" class="note">…</td>';
    var anchor = btn.closest("tr");
    anchor.parentNode.insertBefore(tr, anchor.nextSibling);
    var s = surveys[i];
    function paint(d){
      if(!d || d.no_consent){ tr.firstChild.innerHTML = '<span class="note">'+esc(T().no_consent)+'</span>'; return; }
      var total = d.total||0, segs = d.segments||{};
      var counts = [1,2,3,4].map(function(x){ return segs[String(x)]||0; });
      var maxc = Math.max(1, Math.max.apply(null, counts));
      var html = '<div style="margin-bottom:8px"><b>'+total+'</b> '+esc(T().total)+
        (d.avg_certainty!=null? ' · '+esc(T().certainty)+': <b>'+Math.round(d.avg_certainty*100)+'%</b>':'')+'</div>';
      [1,2,3,4].forEach(function(sg,ix){
        var c = counts[ix], pct = total?Math.round(c/total*100):0;
        html += '<div class="segrow"><div class="segname"><span class="swatch" style="background:'+SEGC[sg]+'"></span>'+esc(SEGMENT_NAMES[sg][lang==="de"?"de":"en"])+'</div>'+
                '<div class="track"><div class="trackfill" style="width:'+(c/maxc*100)+'%;background:'+SEGC[sg]+'"></div></div>'+
                '<div class="segval"><b>'+c+'</b> · '+pct+'%</div></div>';
      });
      tr.firstChild.innerHTML = html;
    }
    if(isDemo){
      paint(s.consent_granted ? {total:s.n_responses, segments:{"1":72,"2":41,"3":63,"4":36}, avg_certainty:0.82} : {no_consent:true});
      return;
    }
    sb.rpc("admin_survey_summary", {p_admin_code: adminCode, p_survey_id: s.survey_id}).then(function(res){
      paint(res.data);
    });
  }

  function exportCsv(surveyId){
    if(isDemo) return;
    sb.rpc("admin_export", {p_admin_code: adminCode, p_survey_id: surveyId}).then(function(res){
      if(res.error || !res.data || res.data.no_consent) return;
      var rows = res.data;
      var itemIds = QUESTIONS.map(function(q){ return q.id; });
      var base = ["id","created_at","survey_id","language","instrument","segment","segment_label",
                  "prob_sciencephiles","prob_critically_interested","prob_passive_supporters","prob_disengaged",
                  "idx_sl","n_missing","age_year","gender","education","canton","duration_sec"];
      var header = base.concat(itemIds.map(function(x){ return "ans_"+x; }));
      var lines = [header.join(",")];
      rows.forEach(function(r){
        var vals = base.map(function(k){ return cell(r[k]); });
        var a = r.answers || {};
        itemIds.forEach(function(x){ vals.push(cell(a[x])); });
        lines.push(vals.join(","));
      });
      var blob = new Blob(["\uFEFF"+lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "wb_export_"+surveyId+"_"+new Date().toISOString().slice(0,10)+".csv";
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    });
  }
  function cell(v){
    if(v===null||v===undefined) return "";
    var s = (typeof v==="object") ? JSON.stringify(v) : String(v);
    if(/[",\n\r;]/.test(s)) s = '"'+s.replace(/"/g,'""')+'"';
    return s;
  }
  function timeAgo(dt){
    var s = Math.round((Date.now()-dt.getTime())/1000);
    if(s<60) return s+"s"; if(s<3600) return Math.round(s/60)+"m";
    if(s<86400) return Math.round(s/3600)+"h"; return Math.round(s/86400)+"d";
  }
})();
</script>
