<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wissenschaftsbarometer — Live</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');
@font-face{font-family:"Akkurat Pro";src:url("fonts/AkkuratPro-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
:root{
  --red:#e30613; --red-20:#fcd9ca; --red-10:#fdece3;
  --ink:#1d1d1d; --ink-60:#5f5f5f; --line:#e2e2e2; --white:#fff;
  --s1:#e30613; --s2:#ed694b; --s3:#f6af95; --s4:#fcd9ca;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Akkurat Pro","Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--white);font-size:16px}
.wrap{max-width:1180px;margin:0 auto;padding:26px 24px 60px}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:14px;border-bottom:3px solid var(--ink);margin-bottom:24px}
.brandbar img{height:40px;display:block}
.langbar{display:flex;border:2px solid var(--ink)}
.langbar button{border:0;background:var(--white);font:inherit;font-size:12px;font-weight:700;color:var(--ink);padding:5px 10px;cursor:pointer}
.langbar button + button{border-left:2px solid var(--ink)}
.langbar button[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.title{font-family:"Bebas Neue",sans-serif;font-size:52px;line-height:1;letter-spacing:.02em}
.title b{color:var(--red)}
.sub{color:var(--ink-60);font-size:15px;margin-top:6px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:24px}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--red);border:2px solid var(--red);padding:6px 14px;letter-spacing:.05em;text-transform:uppercase}
.live .pulse{width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.bignum{display:flex;gap:0;border:2px solid var(--ink);margin-bottom:24px;flex-wrap:wrap}
.kpi{padding:22px 28px;border-right:2px solid var(--ink);flex:1;min-width:200px}
.kpi:last-child{border-right:0}
.kpi .n{font-family:"Bebas Neue",sans-serif;font-size:64px;line-height:1}
.kpi .l{font-size:13px;color:var(--ink-60);margin-top:6px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.kpi .n{font-size:44px}.title{font-size:38px}}
.panel{border:2px solid var(--ink);padding:22px 24px;margin-bottom:20px}
.grid .panel{margin-bottom:0}
.panel h2{font-family:"Bebas Neue",sans-serif;font-size:28px;letter-spacing:.03em;margin:0 0 16px}
.panel h2 b{color:var(--red)}
.segrow{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.segrow:last-child{margin-bottom:0}
.segname{width:200px;flex:0 0 auto;font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px}
.swatch{width:14px;height:14px;flex:0 0 auto;border:1px solid var(--ink)}
.track{flex:1;height:34px;background:var(--red-10)}
.trackfill{height:100%;transition:width .6s ease;min-width:2px;border-right:1px solid var(--ink)}
.segval{width:110px;flex:0 0 auto;text-align:right;font-size:15px;color:var(--ink-60);font-variant-numeric:tabular-nums}
.segval b{color:var(--ink);font-size:19px}
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.donut{width:190px;height:190px;flex:0 0 auto}
.legendlist{font-size:15px}
.legendlist div{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.legendlist b{font-variant-numeric:tabular-nums;margin-left:auto;padding-left:14px}
.bars{display:flex;gap:18px;flex-wrap:wrap}
.barcol{flex:1;min-width:150px;max-width:260px}
.barcol .cap{font-size:14px;margin-bottom:8px;font-weight:700}
.barcol .cap span{color:var(--ink-60);font-weight:400}
.stack{display:flex;height:26px;background:var(--red-10);border:1px solid var(--ink)}
.stack span{display:block}
.msg{max-width:520px;margin:14vh auto;border:2px solid var(--ink);padding:30px;font-size:15px;line-height:1.5}
.foot{margin-top:10px;font-size:12.5px;color:var(--ink-60);border-top:1px solid var(--line);padding-top:14px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar">
    <img id="logoImg" src="img/logo.png" alt="Wissenschaftsbarometer">
    <div class="langbar" id="langbar">
      <button data-lang="de" aria-pressed="true">DE</button>
      <button data-lang="fr" aria-pressed="false">FR</button>
      <button data-lang="it" aria-pressed="false">IT</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
  <div id="content"></div>
  <div class="foot" id="foot"></div>
</div>

<script src="js/config.js"></script>
<script src="js/content.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  "use strict";
  var SEGC = {1:"#e30613",2:"#ed694b",3:"#f6af95",4:"#fcd9ca"};
  var D = {
    de:{title:"Publikumssegmente", live:"Live", total:"Antworten", last:"Letzte Antwort",
        p_seg:"Antworten pro Segment", p_share:"Anteile", p_gender:"Nach Geschlecht", p_age:"Nach Altersgruppe",
        p_edu:"Nach Bildung", p_canton:"Nach Kanton",
        gender:{"1":"Männlich","2":"Weiblich","3":"Divers","null":"Keine Angabe"},
        age:{"15-34":"15–34","35-54":"35–54","55+":"55+","na":"Keine Angabe"},
        edu:{"low":"Obligatorische Schule oder weniger","mid":"Sekundarstufe II","high":"Tertiärstufe","na":"Keine Angabe"},
        outside:"Ausserhalb CH", noanswer:"Keine Angabe", nodata:"Noch keine Antworten.",
        invalid:"Dieser Link ist nicht (mehr) gültig. Bitte wenden Sie sich an die Veranstalterin bzw. den Veranstalter.",
        foot:"Live-Resultate · Instrument & Typologie: Wissenschaftsbarometer Schweiz · Universität Zürich."},
    fr:{title:"Segments de public", live:"En direct", total:"Réponses", last:"Dernière réponse",
        p_seg:"Réponses par segment", p_share:"Parts", p_gender:"Par sexe", p_age:"Par groupe d'âge",
        p_edu:"Par formation", p_canton:"Par canton",
        gender:{"1":"Masculin","2":"Féminin","3":"Divers","null":"Pas de réponse"},
        age:{"15-34":"15–34","35-54":"35–54","55+":"55+","na":"Pas de réponse"},
        edu:{"low":"École obligatoire ou moins","mid":"Secondaire II","high":"Tertiaire","na":"Pas de réponse"},
        outside:"Hors CH", noanswer:"Pas de réponse", nodata:"Pas encore de réponses.",
        invalid:"Ce lien n'est pas (ou plus) valable. Veuillez vous adresser à l'organisateur.",
        foot:"Résultats en direct · Instrument & typologie : Baromètre scientifique suisse · Université de Zurich."},
    it:{title:"Segmenti di pubblico", live:"In diretta", total:"Risposte", last:"Ultima risposta",
        p_seg:"Risposte per segmento", p_share:"Quote", p_gender:"Per sesso", p_age:"Per gruppo d'età",
        p_edu:"Per formazione", p_canton:"Per Cantone",
        gender:{"1":"Maschile","2":"Femminile","3":"Altro","null":"Nessuna risposta"},
        age:{"15-34":"15–34","35-54":"35–54","55+":"55+","na":"Nessuna risposta"},
        edu:{"low":"Scuola dell'obbligo o meno","mid":"Secondario II","high":"Terziario","na":"Nessuna risposta"},
        outside:"Fuori CH", noanswer:"Nessuna risposta", nodata:"Ancora nessuna risposta.",
        invalid:"Questo link non è (più) valido. Si rivolga all'organizzatore.",
        foot:"Risultati in diretta · Strumento & tipologia: Barometro scientifico svizzero · Università di Zurigo."},
    en:{title:"Audience segments", live:"Live", total:"Responses", last:"Last response",
        p_seg:"Responses per segment", p_share:"Share", p_gender:"By gender", p_age:"By age group",
        p_edu:"By education", p_canton:"By canton",
        gender:{"1":"Male","2":"Female","3":"Other","null":"No answer"},
        age:{"15-34":"15–34","35-54":"35–54","55+":"55+","na":"No answer"},
        edu:{"low":"Compulsory school or less","mid":"Upper secondary","high":"Tertiary","na":"No answer"},
        outside:"Outside CH", noanswer:"No answer", nodata:"No responses yet.",
        invalid:"This link is not (or no longer) valid. Please contact the organiser.",
        foot:"Live results · Instrument & typology: Science Barometer Switzerland · University of Zurich."}
  };
  var lang = "de", cur = null;
  var params = new URLSearchParams(location.search);
  var surveyId = params.get("survey"), token = params.get("token");
  var isDemo = params.get("demo") === "1";

  var _cfg = (typeof CONFIG !== "undefined" && CONFIG) ? CONFIG : {SUPABASE_URL:"",SUPABASE_ANON_KEY:""};
  var sb = null;
  try {
    if(_cfg.SUPABASE_URL && _cfg.SUPABASE_URL.indexOf("YOUR-PROJECT") === -1 && window.supabase)
      sb = window.supabase.createClient(_cfg.SUPABASE_URL, _cfg.SUPABASE_ANON_KEY);
  } catch(e){}

  function T(){ return D[lang]; }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

  document.getElementById("langbar").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    lang = b.getAttribute("data-lang");
    Array.prototype.forEach.call(this.querySelectorAll("button"), function(x){
      x.setAttribute("aria-pressed", x===b?"true":"false");
    });
    document.documentElement.lang = lang;
    if(cur) render(cur); else load();
  });

  function mixWhite(hex,pct){
    var m=/^#?([0-9a-f]{6})$/i.exec(hex); if(!m) return hex;
    var n=parseInt(m[1],16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    function c(x){return Math.round(x+(255-x)*pct);}
    return "#"+((1<<24)+(c(r)<<16)+(c(g)<<8)+c(b)).toString(16).slice(1);
  }
  function applyBranding(cfg){
    if(!cfg) return;
    if(cfg.color && /^#?[0-9a-f]{6}$/i.test(cfg.color)){
      var base = cfg.color.charAt(0)==="#"?cfg.color:"#"+cfg.color;
      var rs = document.documentElement.style;
      rs.setProperty("--red", base);
      rs.setProperty("--red-20", mixWhite(base,0.80));
      rs.setProperty("--red-10", mixWhite(base,0.92));
    }
    if(cfg.logo && /^data:image\//.test(cfg.logo)) document.getElementById("logoImg").src = cfg.logo;
  }

  function load(){
    if(isDemo){ render(demoData()); return; }
    if(!sb || !surveyId || !token){ showMsg(T().invalid); return; }
    sb.rpc("survey_public_summary", {p_survey_id: surveyId, p_token: token}).then(function(res){
      if(res.error || !res.data){ showMsg(T().invalid); return; }
      render(res.data);
    }).catch(function(){ showMsg(T().invalid); });
  }
  function showMsg(m){ document.getElementById("content").innerHTML = '<div class="msg">'+esc(m)+'</div>'; }

  function render(d){
    cur = d;
    var total = d.total || 0;
    var segs = d.segments || {};
    var counts = [1,2,3,4].map(function(s){ return segs[String(s)]||0; });
    var maxc = Math.max(1, Math.max.apply(null, counts));
    var lastTxt = d.last_response_at ? timeAgo(new Date(d.last_response_at)) : "—";

    var html =
      '<div class="head"><div>'+
        '<div class="title">'+esc(T().title)+'<b>.</b></div>'+
        '<div class="sub">'+esc(d.display_name || surveyId || "")+'</div>'+
      '</div><span class="live"><span class="pulse"></span>'+esc(T().live)+'</span></div>'+
      '<div class="bignum">'+
        '<div class="kpi"><div class="n">'+total+'</div><div class="l">'+esc(T().total)+'</div></div>'+
        '<div class="kpi"><div class="n">'+lastTxt+'</div><div class="l">'+esc(T().last)+'</div></div>'+
      '</div>'+
      '<div class="grid">'+
        '<div class="panel"><h2>'+esc(T().p_seg)+'<b>.</b></h2><div id="segBars">'+
          (total===0 ? '<div style="color:var(--ink-60)">'+esc(T().nodata)+'</div>' :
            [1,2,3,4].map(function(s,i){
              var c = counts[i], pct = total?Math.round(c/total*100):0;
              return '<div class="segrow">'+
                '<div class="segname"><span class="swatch" style="background:'+SEGC[s]+'"></span>'+esc(SEGMENT_NAMES[s][lang])+'</div>'+
                '<div class="track"><div class="trackfill" style="width:'+(c/maxc*100)+'%;background:'+SEGC[s]+'"></div></div>'+
                '<div class="segval"><b>'+c+'</b> · '+pct+'%</div></div>';
            }).join(""))+
        '</div></div>'+
        '<div class="panel"><h2>'+esc(T().p_share)+'<b>.</b></h2><div class="donut-wrap">'+
          donut(counts,total)+'<div class="legendlist">'+
          [1,2,3,4].map(function(s,i){
            var pct = total?Math.round(counts[i]/total*100):0;
            return '<div><span class="swatch" style="background:'+SEGC[s]+'"></span>'+esc(SEGMENT_NAMES[s][lang])+' <b>'+pct+'%</b></div>';
          }).join("")+'</div></div></div>'+
      '</div>'+
      panel(T().p_gender, breakdown(d.segment_by_gender||[], function(r){return r.gender==null?"null":String(r.gender);},["1","2","3","null"], function(g){return T().gender[g]||g;}, false))+
      panel(T().p_age, breakdown(d.segment_by_age||[], function(r){return r.grp;}, ["15-34","35-54","55+","na"], function(g){return T().age[g]||g;}, false))+
      panel(T().p_edu, breakdown(d.segment_by_edu||[], function(r){return r.grp;}, ["low","mid","high","na"], function(g){return T().edu[g]||g;}, false))+
      panel(T().p_canton, breakdown(d.segment_by_canton||[], function(r){return r.grp;}, null, function(g){return g==="na"?T().noanswer:(g==="EXT"?T().outside:g);}, true));

    document.getElementById("content").innerHTML = html;
    document.getElementById("foot").textContent = T().foot;
  }
  function panel(title, inner){ return '<div class="panel"><h2>'+esc(title)+'<b>.</b></h2><div class="bars">'+inner+'</div></div>'; }
  function breakdown(rows, keyFn, order, labelFn, sortByTotal){
    var byG = {};
    rows.forEach(function(r){
      var g = keyFn(r);
      byG[g] = byG[g] || {total:0, seg:{1:0,2:0,3:0,4:0}};
      byG[g].seg[r.segment] += r.c; byG[g].total += r.c;
    });
    var keys = order ? order.filter(function(g){return byG[g];}) : Object.keys(byG);
    if(sortByTotal) keys.sort(function(a,b){
      if(a==="na") return 1; if(b==="na") return -1;
      return byG[b].total - byG[a].total;
    });
    if(!keys.length) return '<div style="color:var(--ink-60);font-size:14px">'+esc(T().nodata)+'</div>';
    return keys.map(function(g){
      var o = byG[g];
      var stack = [1,2,3,4].map(function(s){
        var w = o.total ? (o.seg[s]/o.total*100) : 0;
        return w>0 ? '<span style="width:'+w+'%;background:'+SEGC[s]+'"></span>' : '';
      }).join("");
      return '<div class="barcol"><div class="cap">'+esc(labelFn(g))+' <span>· '+o.total+'</span></div><div class="stack">'+stack+'</div></div>';
    }).join("");
  }
  function donut(counts,total){
    var s = '<svg class="donut" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="#fdece3" stroke-width="6"/>';
    if(total>0){
      var off = 25;
      [1,2,3,4].forEach(function(sg,i){
        var len = counts[i]/total*100; if(len<=0) return;
        s += '<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+SEGC[sg]+'" stroke-width="6" stroke-dasharray="'+len+' '+(100-len)+'" stroke-dashoffset="'+off+'"/>';
        off -= len;
      });
    }
    s += '<text x="21" y="20.5" text-anchor="middle" font-size="8" font-weight="700" fill="#1d1d1d" font-family="Bebas Neue">'+total+'</text>'+
         '<text x="21" y="26" text-anchor="middle" font-size="3" fill="#5f5f5f">total</text></svg>';
    return s;
  }
  function timeAgo(dt){
    var s = Math.round((Date.now()-dt.getTime())/1000);
    if(s<60) return s+"s"; if(s<3600) return Math.round(s/60)+"m";
    if(s<86400) return Math.round(s/3600)+"h"; return Math.round(s/86400)+"d";
  }
  function demoData(){
    return { display_name:"Demo-Survey", total:148, last_response_at:new Date(Date.now()-3*60000).toISOString(),
      segments:{"1":47,"2":33,"3":41,"4":27},
      segment_by_gender:[{gender:1,segment:1,c:19},{gender:1,segment:2,c:18},{gender:1,segment:3,c:20},{gender:1,segment:4,c:14},
        {gender:2,segment:1,c:26},{gender:2,segment:2,c:14},{gender:2,segment:3,c:19},{gender:2,segment:4,c:12}],
      segment_by_age:[{grp:"15-34",segment:1,c:18},{grp:"15-34",segment:3,c:11},{grp:"35-54",segment:1,c:16},{grp:"35-54",segment:2,c:12},
        {grp:"55+",segment:3,c:13},{grp:"55+",segment:4,c:9}],
      segment_by_edu:[{grp:"low",segment:4,c:9},{grp:"mid",segment:1,c:17},{grp:"mid",segment:3,c:20},{grp:"high",segment:1,c:25},{grp:"high",segment:2,c:13}],
      segment_by_canton:[{grp:"ZH",segment:1,c:16},{grp:"ZH",segment:2,c:9},{grp:"BE",segment:1,c:8},{grp:"BE",segment:3,c:8},{grp:"EXT",segment:1,c:5}] };
  }

  // branded look for real surveys
  if(!isDemo && sb && surveyId){
    sb.rpc("get_survey_config", {p_survey_id: surveyId}).then(function(res){
      if(!res.error && res.data) applyBranding(res.data.config || {});
    }).catch(function(){});
  }
  load();
  if(!isDemo) setInterval(load, 15000);
})();
</script>
</body>
</html>
